<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>紫微斗數論命</title><meta name="description" content="輸入生辰排出紫微斗數十二宮命盤，產生含古籍出處的命書，可存檔並下載 Word／PDF。">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#24192e;--paper:#f4f0f7;--card:#fffdf8;--pur:#5b2a86;--gold:#b08a3e;--mut:#6f6380;--line:#ddd1e6;--red:#b0322a}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;background:var(--paper);color:var(--ink);line-height:1.75}
header{background:linear-gradient(135deg,#2a1640,#5b2a86);color:#f3e7c8;padding:26px 16px;text-align:center}
header h1{margin:0;font-size:2.1em;letter-spacing:.3em}header p{margin:6px 0 0;opacity:.85}
main{max-width:1120px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px #0001}
h2{margin:0 0 10px;color:var(--pur);font-size:1.25em;border-left:4px solid var(--gold);padding-left:8px}
h3{margin:14px 0 6px;color:#6a3d1c;font-size:1.05em}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.form label{display:flex;flex-direction:column;font-size:.88em;color:var(--mut)}
input,select,button{font:inherit;padding:6px 9px;border:1px solid #c6b5d6;border-radius:6px;background:#fff;color:var(--ink)}
button{cursor:pointer}.btn{background:var(--pur);color:#fff;border-color:var(--pur)}.btn:disabled{opacity:.6}.btnlike{display:inline-block;padding:6px 9px;border:1px solid #c6b5d6;border-radius:6px;background:#fff;cursor:pointer;color:var(--ink);font-size:1em;flex-direction:row}
.sub{font-size:.85em;color:var(--mut)}#msg{min-height:1.4em;color:var(--pur);font-size:.9em;margin-top:6px}
.bar{flex-wrap:nowrap!important;position:sticky;top:var(--rg-nav-h, calc(40px + env(safe-area-inset-top, 0px)));z-index:5;background:#fffdf8ee;backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* 命盤 */
.zwwrap{overflow-x:auto}
.zwgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,auto);gap:2px;background:#8a6fa3;border:2px solid #5b2a86;min-width:360px;font-size:13px;line-height:1.3}
.cell{background:#fff;padding:4px 4px 2px;overflow:hidden;overflow-wrap:anywhere;display:flex;flex-direction:column;min-height:170px;position:relative;cursor:pointer}
.cell.ming{background:#fff6e8}.cell.sel{outline:3px solid #d4a017;outline-offset:-3px;background:#fffbe0}.cell.sf{background:#f3ecfb}
.stars{display:flex;flex-wrap:wrap;gap:1px 6px}
.st{display:inline-flex;align-items:baseline;gap:1px;white-space:nowrap}.st b{font-weight:600}.mj b{color:#b0322a;font-size:1.12em}.mn b{color:#2b4f8a}.mn.bad b{color:#555}
.st em{font-style:normal;font-size:.75em;color:var(--mut)}
.h{font-style:normal;font-size:.72em;color:#fff;border-radius:3px;padding:0 2px;margin-left:1px}.h祿{background:#2e8b57}.h權{background:#8a2be2}.h科{background:#1e6fb8}.h忌{background:#c0392b}
.sh{font-style:normal;font-size:.7em;color:#c0392b;margin-left:1px}
.adj{font-size:.78em;color:#6b5a7a;margin-top:2px}
.flow{font-size:.75em;margin-top:2px}.tg{display:inline-block;border:1px solid #c9b3dd;border-radius:3px;padding:0 2px;margin:1px;color:#5b2a86}.tg.tm{background:#5b2a86;color:#fff}.fs{color:#8a5a00;margin-left:2px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:2px;font-size:.78em}
.gods{color:#6b5a7a}.pn{text-align:right;display:flex;flex-direction:column}.pn b{color:var(--pur);font-size:1.15em}.pn small{background:#b0322a;color:#fff;border-radius:3px;padding:0 2px;margin-left:2px;font-size:.7em}.rg{color:#555}.gz{color:#555}
.ages{font-size:10px;color:#8b7d99}.h,.sh,.st em,.lg,.pn small,.bz small,.tg,.fs{font-size:10px!important}.cf{font-size:max(10px,1em)!important}
.center{background:#faf6fd;padding:8px;text-align:center;font-size:.95em;display:flex;flex-direction:column;gap:2px;justify-content:center}
.ct{font-size:1.3em;color:var(--pur);font-weight:bold}.bz{display:flex;justify-content:center;gap:10px;font-size:1.1em}.bz small{display:block;font-size:.65em;color:var(--mut)}
.cf{margin-top:4px;color:#8a5a00;font-size:.9em}.lg{font-size:.75em;color:var(--mut);margin-top:4px}
/* 命書 */
.bookhead h1{text-align:center;color:var(--pur);letter-spacing:.15em;margin:4px 0 8px;font-size:1.6em}
table.meta{margin:0 auto 8px;border-collapse:collapse}table.meta th{color:var(--mut);font-weight:normal;padding:2px 10px;text-align:right}table.meta td{padding:2px 10px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.toc a{font-size:.85em;color:var(--pur);border:1px solid var(--line);border-radius:14px;padding:2px 10px;text-decoration:none;background:#fff}
.bks{border-top:1px solid var(--line);padding-top:6px;margin-top:10px;scroll-margin-top:calc(var(--rg-nav-h, 40px) + 64px)}
.bks h2{margin-top:10px}.bks p{margin:4px 0}
blockquote{margin:6px 0 8px 1em;padding:6px 12px;border-left:3px solid var(--gold);background:#fbf7ee;color:#3b2a55}blockquote cite{display:block;text-align:right;font-size:.8em;color:var(--mut);font-style:normal}
.note{font-size:.85em;color:var(--mut)}
.tw{overflow-x:auto}.tw table{border-collapse:collapse;width:100%;font-size:.88em;margin:6px 0}.tw th,.tw td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}.tw th{background:#efe6f6;white-space:nowrap}.tw td.nw{white-space:nowrap}
.more{position:relative}.more summary{list-style:none;cursor:pointer;padding:6px 9px;border:1px solid #c6b5d6;border-radius:6px;background:#fff}.more summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 12px #0002;display:flex;flex-direction:column;gap:4px;padding:6px;z-index:20;min-width:8em}
.cdet{margin-top:6px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.6}
.bookchart{margin:6px 0}
footer{text-align:center;color:var(--mut);font-size:.85em;padding:20px}
.zwgrid .ages,.zwgrid .h,.zwgrid .sh,.zwgrid .st em,.zwgrid .lg,.zwgrid .pn small,.zwgrid .bz small,.zwgrid .tg,.zwgrid .fs,.zwgrid .adj,.zwgrid .flow,.zwgrid .foot{font-size:11px!important}
@media(max-width:600px){html body .zwgrid,html body .zwgrid *{font-size:11px!important}html body .zwgrid .mj b{font-size:13px!important}html body .zwgrid .center .nm,html body .zwgrid .center h3{font-size:14px!important}header h1{font-size:1.6em}#chartCard{padding:8px 3px}#chartCard h2{margin-left:6px}.zwgrid{min-width:0;font-size:11px!important}.cell .adj,.cell .gods,.cell .ages,.cell .fs{display:none}.cell{min-height:118px}.st em,.h,.sh,.tg,.foot,.rg,.gz{font-size:10px!important}.pn b{font-size:11px}.center{font-size:11px!important}.lg{font-size:10px}.tg{padding:0 1px;margin:0}.bar{padding:6px;gap:5px}.tw td,.tw th{padding:3px 4px}.tw table{font-size:.92em}.bar>button,.more summary{padding:4px 8px;font-size:.88em;white-space:nowrap}.st{white-space:normal}.zwgrid{font-size:10.5px}.cell{min-height:150px;padding:3px 2px}.foot{flex-direction:column;align-items:stretch}.pn{text-align:left}.center{font-size:.9em}.bz{gap:6px}main{padding:8px}}
@media print{.noprint,header p,footer,.bar,#inputCard,#caseCard{display:none!important}body{background:#fff}.card{box-shadow:none;border:none;padding:0}main{max-width:none}#chartCard{display:none}.zwgrid{font-size:10px}.cell{min-height:120px}.bks{break-inside:auto}h2,h3{break-after:avoid}blockquote,tr{break-inside:avoid}}
</style>
<script src="https://regulusab.github.io/nav/nav.js" defer></script>
</head><body>
<header><h1>紫微斗數論命</h1><p>依生辰排十二宮命盤・四化・大限流年，產生附古籍出處的命書</p></header>
<main>
<section class="card" id="inputCard"><h2>命造輸入</h2>
<div class="form">
<label>姓名／命例名<input id="name" placeholder="可留空" size="10"></label>
<label>曆法<select id="cal"><option value="solar">西曆（國曆）</option><option value="lunar">農曆（手動輸入）</option></select></label>
<span id="solarBox" class="form"><label>西曆出生日期<input type="date" id="sdate" min="1900-01-31" max="2100-12-31"></label>
<label>出生時間（自動換算時辰）<input type="time" id="stime"></label></span>
<span id="lunarBox" class="form" style="display:none"><label>農曆年（西元）<input type="number" id="lyear" min="1900" max="2100" value="1990" style="width:6em"></label>
<label>月<select id="lmon"></select></label><label>日<select id="lday"></select></label><label>閏月<input type="checkbox" id="lleap"></label></span>
<label>時辰<select id="tidx"></select></label>
<label>性別<select id="gender"><option value="男">男（乾造）</option><option value="女">女（坤造）</option></select></label>
</div>
<details style="margin-top:8px"><summary class="sub">派別與進階設定</summary>
<div class="form" style="margin-top:8px">
<label>子時換日<select id="zi"><option value="forward">23:00 即換日（晚子時算翌日）</option><option value="current">0:00 才換日（晚子時算當日）</option></select></label>
<label>四化表<select id="table"></select></label>
<label>年界<select id="ydiv"><option value="normal">農曆正月初一</option><option value="exact">立春</option></select></label>
</div><p class="sub" id="tableNote"></p></details>
<div class="form" style="margin-top:10px">
<label>流年（西元）<input type="number" id="fyear" min="1900" max="2120" style="width:6em"></label>
<label>流日（西曆）<input type="date" id="fday" min="1900-01-31" max="2100-12-31"></label>
<label>流時<select id="fhour"></select></label><span class="sub">晚子時（23:00 後）請選翌日子時；流時採當日日干起時干。</span>
<button class="btn" id="go">排盤並產生命書</button></div>
<div id="msg"></div>
</section>
<section class="card" id="caseCard"><h2>命例存檔</h2>
<div class="form"><select id="caseList"></select><button id="caseLoad">載入</button><button id="caseSave">儲存目前命例</button><button id="caseDel">刪除</button>
<button id="caseExport">匯出全部</button><label class="btnlike">匯入<input type="file" id="caseImport" accept=".json" style="display:none"></label></div>
<div class="form" style="margin-top:6px"><label style="flex:1">備註<input id="caseNote" placeholder="例：來源、核對情形"></label></div>
<p class="sub">命例只存在這台裝置的瀏覽器中；可用「匯出全部」備份。</p></section>
<div id="out" style="display:none">
<div class="bar noprint"><b style="color:var(--pur)">命書</b><button id="dlPdf">下載 PDF</button><button id="dlDocx">下載 Word</button><details class="more"><summary>更多 ▾</summary><div class="menu"><button id="print">列印</button><button id="share">分享</button><button id="copyLink">複製連結</button><button id="dlJson" title="命書資料（JSON）">資料檔</button></div></details></div>
<section class="card" id="chartCard"><h2>命盤</h2><div class="zwwrap"><div id="chart"></div></div></section>
<section class="card" id="bookCard"><div id="book"></div></section>
</div>
</main>
<footer>排盤核心：<a href="https://github.com/SylarLong/iztro">iztro</a>（MIT）；古籍引文：維基文庫《紫微斗數全書》《禮記・月令》《淮南子・天文訓》《尚書・洪範》。命理內容僅供參考。</footer>
<script src="vendor/iztro.min.js"></script>
<script src="js/engine.js"></script><script src="js/chart.js"></script><script src="js/book.js"></script><script src="js/render.js"></script><script src="js/export.js"></script><script src="js/cases.js"></script><script src="js/app.js"></script>
</body></html>
